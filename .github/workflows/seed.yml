name: Seed entities and events

on:
  push:
    branches: [main]
    paths: ["data/entities.yaml", "data/events.yaml"]
  workflow_dispatch:

concurrency:
  group: analysis
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install google-auth requests PyYAML
      - name: Seed
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then echo "::warning::FIREBASE_SERVICE_ACCOUNT not set, skipping"; exit 0; fi
          python -m analysis seed
