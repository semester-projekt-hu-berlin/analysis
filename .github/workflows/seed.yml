name: Seed entities and events

on:
  push:
    branches: [main]
    paths: ["data/entities.yaml", "data/events.yaml"]
  workflow_dispatch:

concurrency:
  group: analysis
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # GitHub OIDC token, only used for keyless auth (see analyze.yml and the README)
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ (vars.GCP_WIF_PROVIDER == '' || vars.GCP_SERVICE_ACCOUNT == '') && secrets.FIREBASE_SERVICE_ACCOUNT || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Authenticate to Google Cloud (Workload Identity Federation, optional)
        if: vars.GCP_WIF_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install google-auth requests PyYAML
      - name: Seed
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ] && [ -z "${GOOGLE_APPLICATION_CREDENTIALS:-}" ]; then
            echo "::warning::Neither FIREBASE_SERVICE_ACCOUNT nor keyless auth set, skipping"; exit 0
          fi
          python -m analysis seed
