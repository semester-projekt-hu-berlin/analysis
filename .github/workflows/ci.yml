name: CI

on:
  push:
    branches-ignore: ["dependabot/**"] # their pull request runs CI already
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]

permissions:
  contents: read

# a newer push to the same branch or PR supersedes the running check
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      # Tests use fake NER/sentiment models, so torch/flair are not needed here.
      - run: pip install -r requirements-dev.txt google-auth requests PyYAML segtok anthropic
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
