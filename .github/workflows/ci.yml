name: CI

on:
  push:
    branches-ignore: ["dependabot/**"] # their pull request runs CI already
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]

permissions:
  contents: read

# a newer push to the same branch or PR supersedes the running check
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      # Tests use fake NER/sentiment models, so torch/flair are not needed here.
      - run: pip install -r requirements-dev.txt google-auth requests PyYAML segtok anthropic
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
