name: Analyze comments

on:
  schedule:
    - cron: "30 5,17 * * *" # twice a day, ~1 h after the crawler (17 4,16 * * * UTC)
  workflow_dispatch:
    inputs:
      limit:
        description: Max comments to analyze in this run
        default: "20000"
      ner:
        description: NER backend (flair | bert | none)
        default: flair
      reaggregate:
        description: Rebuild all aggregates from mentions afterwards
        type: boolean
        default: false

concurrency:
  group: analysis # never run two pipelines against Firestore at the same time
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 150 # a half-day backlog (4–8k comments) takes 20–40 min on 4 vCPU, up to ~2 h on 2 vCPU
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      HF_HOME: ${{ github.workspace }}/.hf-cache
      FLAIR_CACHE_ROOT: ${{ github.workspace }}/.flair-cache
      ANALYSIS_CACHE_DIR: ${{ github.workspace }}/.cache
      TOKENIZERS_PARALLELISM: "false"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Check secret
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT is not available to this repository."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install (CPU-only torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Cache models (Hugging Face + Flair)
        uses: actions/cache@v4
        with:
          path: |
            .hf-cache
            .flair-cache
          key: models-v2-flair-ner-german-news-guhr-sentiment
          restore-keys: models-

      - name: Cache Wikidata lookups
        uses: actions/cache@v4
        with:
          path: .cache
          key: wikidata-${{ github.run_id }}
          restore-keys: wikidata-

      - name: Analyze
        run: python -m analysis run --limit "${{ inputs.limit || '20000' }}" --ner "${{ inputs.ner || 'flair' }}"

      - name: Reaggregate
        if: ${{ inputs.reaggregate }}
        run: python -m analysis reaggregate
