name: Analyze comments

on:
  schedule:
    # twice a day, ~1 h after the crawler (17 4,16 * * * UTC). Fallback only: Cloud Scheduler (via the
    # api repo) dispatches the same slots on time; see the gate job.
    - cron: "30 5,17 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: Max comments to analyze in this run
        default: "9000"
      ner:
        description: NER backend (bert | flair | none)
        default: bert
      reaggregate:
        description: Rebuild all aggregates from mentions afterwards
        type: boolean
        default: false
      trigger:
        description: "Set to vercel-cron by the API's cron dispatch (Cloud Scheduler; enables duplicate detection); leave empty for manual runs"
        default: ""

concurrency:
  group: analysis # never run two pipelines against Firestore at the same time
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The GitHub `schedule` is only a fallback: on busy days it starts hours late, so Cloud Scheduler
  # (via the api repo's cron endpoint) dispatches this workflow with trigger=vercel-cron. This job skips a
  # scheduled run if its slot was already handled, and drops duplicate cron deliveries.
  gate:
    if: github.event_name == 'schedule' || inputs.trigger == 'vercel-cron'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Skip if this slot already ran
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          WORKFLOW: analyze.yml
          JOB: analyze
        run: |
          api="repos/$GITHUB_REPOSITORY/actions"
          fail_open() { echo "::warning::Duplicate check failed ($1), running anyway."; echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; }

          created=$(gh api "$api/runs/$GITHUB_RUN_ID" --jq .created_at) || fail_open "run lookup"
          now=$(date -u -d "$created" +%s) || fail_open "date"

          # Look-back window. Schedule: from 1 h before the slot this run belongs to (GitHub may start it
          # hours late). Cron dispatch: 3 h (duplicate deliveries).
          since=$((now - 4 * 3600))
          if [ "$EVENT" = schedule ]; then
            read -r min hours _ <<< "$SCHEDULE"
            if [[ "$min" =~ ^[0-9]+$ && "$hours" =~ ^[0-9]+(,[0-9]+)*$ ]]; then
              slot=0
              for d in "$(date -u -d "@$now" +%F)" "$(date -u -d "@$((now - 86400))" +%F)"; do
                for h in ${hours//,/ }; do
                  t=$(date -u -d "$d $((10#$h)):$((10#$min)):00" +%s)
                  if [ "$t" -le "$now" ] && [ "$t" -gt "$slot" ]; then slot=$t; fi
                done
              done
              [ "$slot" -gt 0 ] && since=$((slot - 3600))
            fi
          else
            since=$((now - 3 * 3600))
          fi
          since_iso=$(date -u -d "@$since" +%FT%TZ)
          echo "This run: $EVENT, created $created; looking for other runs created since $since_iso"

          runs=$(gh api -X GET "$api/workflows/$WORKFLOW/runs" -f created=">=$since_iso" -F per_page=50 \
            --jq ".workflow_runs[] | select(.id != $GITHUB_RUN_ID) | [.id, .status, (.conclusion // \"-\"), .event, .created_at] | @tsv") || fail_open "run list"

          skip=false
          while IFS=$'\t' read -r id status conclusion event at; do
            [ -n "$id" ] || continue
            echo "  run $id: $event, created $at, $status/$conclusion"
            if [ "$status" != completed ]; then
              skip=true; reason="run $id ($event, created $at) is $status"; break
            fi
            if [ "$conclusion" = success ]; then
              # a run whose main job was skipped by this gate also ends as "success": check the job itself
              job=$(gh api "$api/runs/$id/jobs" --jq "[.jobs[] | select(.name == \"$JOB\") | .conclusion] | first // \"-\"") || fail_open "job lookup"
              if [ "$job" = success ]; then skip=true; reason="run $id ($event, created $at) succeeded"; break; fi
            fi
          done <<< "$runs"

          if [ "$skip" = true ]; then echo "::notice::Skipping: $reason."; else echo "No successful or running run in the window, running."; fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  analyze:
    needs: gate
    # runs unless the gate found a duplicate (also when the gate was not needed or failed)
    if: ${{ !cancelled() && needs.gate.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150 # ~4k comments per half day take 20-45 min on the 4-vCPU runners; 9000 fit with margin
    permissions:
      contents: read
      id-token: write # GitHub OIDC token, only used for keyless auth (see below)
    env:
      # the key would take precedence over the keyless credentials, so it is left out when they are set
      FIREBASE_SERVICE_ACCOUNT: ${{ (vars.GCP_WIF_PROVIDER == '' || vars.GCP_SERVICE_ACCOUNT == '') && secrets.FIREBASE_SERVICE_ACCOUNT || '' }}
      # soft deadline (analysis/timebudget.py): from the job start, 15 min before timeout-minutes, the run
      # saves its cursors, aggregates what it processed, records the budget and exits cleanly
      ANALYSIS_TIME_BUDGET_MIN: "135"
      # the models run through ONNX Runtime when it reproduces the PyTorch logits (checked at every
      # load, else PyTorch is used; analysis/onnx_backend.py). "0" goes back to PyTorch only.
      ANALYSIS_ONNX: "1"
      HF_HOME: ${{ github.workspace }}/.hf-cache
      FLAIR_CACHE_ROOT: ${{ github.workspace }}/.flair-cache
      ANALYSIS_CACHE_DIR: ${{ github.workspace }}/.cache
      TOKENIZERS_PARALLELISM: "false"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Record the job start (time budget)
        run: echo "ANALYSIS_JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Keyless auth (optional, see README): once the repository variables GCP_WIF_PROVIDER and
      # GCP_SERVICE_ACCOUNT are set, the job gets short-lived credentials through Workload Identity
      # Federation (GOOGLE_APPLICATION_CREDENTIALS) and the JSON key is not passed. Without them,
      # nothing changes: the step is skipped and the secret FIREBASE_SERVICE_ACCOUNT is used.
      - name: Authenticate to Google Cloud (Workload Identity Federation)
        if: vars.GCP_WIF_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Check secret
        if: vars.GCP_WIF_PROVIDER == '' || vars.GCP_SERVICE_ACCOUNT == ''
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT is not available to this repository."
            exit 1
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # dispatch inputs reach the shell as environment variables, never as interpolated script text
      - name: Install (CPU-only torch)
        env:
          NER: ${{ inputs.ner || 'bert' }}
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          # Flair and its ~60 dependencies only when its NER is asked for
          if [ "$NER" = "flair" ]; then pip install -r requirements-flair.txt; fi

      # Model weights (also the fine-tuned sentiment model from its release, .hf-cache/meinungspuls) and
      # their ONNX exports (.hf-cache/onnx, written on the first run with a new key). A cache is
      # immutable per key: bump the key when a model or the export changes.
      - name: Cache models (Hugging Face, ONNX exports, Flair)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .hf-cache
            .flair-cache
          key: models-v5-bert-ner-mdeberta-nli-news-sentiment-ft3-onnx1
          restore-keys: models-

      - name: Cache Wikidata lookups
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache
          key: wikidata-${{ github.run_id }}
          restore-keys: wikidata-

      # the run ends with the automatic events of yesterday and today (README, "Automatic events"),
      # explained by an OpenAI-compatible LLM when the variables and the secret below are set
      - name: Analyze
        env:
          LIMIT: ${{ inputs.limit || '9000' }}
          NER: ${{ inputs.ner || 'bert' }}
          EVENTS_LLM_BASE_URL: ${{ vars.EVENTS_LLM_BASE_URL || (secrets.EVENTS_LLM_API_KEY && 'https://generativelanguage.googleapis.com/v1beta/openai' || '') }}
          EVENTS_LLM_MODEL: ${{ vars.EVENTS_LLM_MODEL || 'gemini-2.5-flash-lite' }}
          EVENTS_LLM_API_KEY: ${{ secrets.EVENTS_LLM_API_KEY }}
        run: python -m analysis run --limit "$LIMIT" --ner "$NER"

      - name: Reaggregate
        if: ${{ inputs.reaggregate }}
        run: python -m analysis reaggregate
