name: Automatic events (backfill)

# Detects automatic events for a range of days and explains them from the headlines (README,
# "Automatic events"). The regular analysis run does the same for yesterday and today; this is
# for a backfill or a re-run after changing the thresholds.
on:
  workflow_dispatch:
    inputs:
      since:
        description: First day (YYYY-MM-DD)
        required: true
        default: "2026-10-20"
      until:
        description: Last day (YYYY-MM-DD, empty = today)
        default: ""
      dry_run:
        description: Detect and explain, but write no events
        type: boolean
        default: true

concurrency:
  group: analysis # never run two jobs against Firestore at the same time
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  events:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # GitHub OIDC token, only used for keyless auth (see analyze.yml and the README)
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ (vars.GCP_WIF_PROVIDER == '' || vars.GCP_SERVICE_ACCOUNT == '') && secrets.FIREBASE_SERVICE_ACCOUNT || '' }}
      ANALYSIS_TIME_BUDGET_MIN: "25"
      EVENTS_LLM_SECONDS: "900" # a backfill needs more LLM requests than a run
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Record the job start (time budget)
        run: echo "ANALYSIS_JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        if: vars.GCP_WIF_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Check secret
        if: vars.GCP_WIF_PROVIDER == '' || vars.GCP_SERVICE_ACCOUNT == ''
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT is not available to this repository."
            exit 1
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # no models needed: only the Firestore client and the Anthropic SDK
      - run: pip install google-auth requests PyYAML anthropic

      # dispatch inputs reach the shell as environment variables, never as interpolated script text
      - name: Events
        env:
          SINCE: ${{ inputs.since }}
          UNTIL: ${{ inputs.until }}
          DRY_RUN: ${{ inputs.dry_run }}
          EVENTS_LLM_MODEL: ${{ vars.EVENTS_LLM_MODEL }} # empty: claude-haiku-5-5
          EVENTS_LLM_API_KEY: ${{ secrets.EVENTS_LLM_API_KEY }} # Anthropic API key
        run: |
          args=(events --since "$SINCE")
          if [ -n "$UNTIL" ]; then args+=(--until "$UNTIL"); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python -m analysis "${args[@]}"
