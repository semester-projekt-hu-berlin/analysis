name: Eval sentiment with headline context

# Manual experiment (scripts/eval_sentiment_context.py, results in eval/README.md): the fine-tuned
# sentiment model cross-validated with and without the article headline in its input. Reads the
# labelled comments and their headlines from Firestore into memory (about 1,400 reads per fold
# job, recorded in meta/budget) and writes nothing to Firestore but that record. The repository is
# public: the logs and the summary hold aggregate metrics only; the per-pair results passed from
# the fold jobs to the report job are encrypted with a key derived from the Firestore secret.
on:
  workflow_dispatch:
    inputs:
      variants:
        description: Comma-separated variants (base, title, title-short)
        default: base,title,title-short

permissions:
  contents: read

concurrency:
  group: eval-context
  cancel-in-progress: false

jobs:
  fold:
    runs-on: ubuntu-latest
    timeout-minutes: 300 # three variants of one fold take about 1.5-2 h on 4 vCPUs
    strategy:
      fail-fast: true
      matrix:
        fold: [0, 1, 2, 3, 4]
    permissions:
      contents: read
      id-token: write # GitHub OIDC token, only used for keyless auth (see analyze.yml and the README)
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ (vars.GCP_WIF_PROVIDER == '' || vars.GCP_SERVICE_ACCOUNT == '') && secrets.FIREBASE_SERVICE_ACCOUNT || '' }}
      # key material for the encrypted fold results (also when keyless auth is used for Firestore)
      EVAL_KEY_MATERIAL: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      HF_HOME: ${{ github.workspace }}/.hf-cache
      TOKENIZERS_PARALLELISM: "false"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        if: vars.GCP_WIF_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Check secret
        run: |
          if [ -z "$EVAL_KEY_MATERIAL" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT is not available to this repository."
            exit 1
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install (CPU-only torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      # the base NLI model from the analysis run's model cache (restore only, the key stays theirs)
      - name: Restore models (Hugging Face)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .hf-cache
            .flair-cache
          key: models-v5-bert-ner-mdeberta-nli-news-sentiment-ft3-onnx1
          restore-keys: models-

      - name: Train and score one fold
        env:
          FOLD: ${{ matrix.fold }}
          VARIANTS: ${{ inputs.variants }}
        run: python scripts/eval_sentiment_context.py fold --fold "$FOLD" --variants "$VARIANTS" --out "fold-$FOLD.bin"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fold-${{ matrix.fold }}
          path: fold-${{ matrix.fold }}.bin
          retention-days: 1
          if-no-files-found: error

  report:
    needs: fold
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EVAL_KEY_MATERIAL: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - run: pip install google-auth requests PyYAML segtok

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: folds

      - name: Report (aggregates only)
        run: python scripts/eval_sentiment_context.py report --dir folds
