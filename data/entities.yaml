# Cue sets (`cue: press_f`): local evidence that a contextual (@) or cue-only (%) alias is the entity.
#   before: the word right before ("laut Bild", "der ZEIT", "Quelle: WELT"); after: the word right after
#   ("Bild berichtet", "Spiegel-Online"); colon: "WELT: ..." headlines; quoted: „Spiegel“; compound:
#   "ZEIT-Redakteurin", "Bild-Chef"; neighbors: another medium in a list ("Spiegel, FAZ und Bild",
#   "ARD/ZDF/Spiegel"), case-sensitive.
cues:
  press_f:   # feminine titles: "der/die Bild", "der WELT", "die ZEIT"
    before: [der, die, laut, lt., bei, Quelle, Quellen, schreibt, schrieb, berichtet, berichtete, meldet, titelt,
      zitiert]
    after: &press_after [berichtet, berichtete, berichten, meldet, meldete, schreibt, schrieb, titelt, titelte, zitiert,
      zitierte, enthüllt, enthüllte, kommentiert, kommentierte, behauptet, behauptete, Artikel, Bericht, Interview,
      Online, online, TV, Podcast, Kolumne, Redaktion, Redakteur, Redakteurin, Reporter, Reporterin, Journalist,
      Journalistin, Journalisten, Chefredakteur, Chefredakteurin, Schlagzeile, Leser, Abo]
    colon: true
    quoted: true
    compound: &press_compound [artikel, bericht, interview, redakt, chefredakt, journalist, kolumn, reporter, umfrage,
      recherche, leser, abo, online, podcast, sendung, hauptstadt, autor, kommentar, schlagzeile, titel, chef, tv,
      zeitung, schreiber, konsument, forum, magazin, heft, ausgabe]
    neighbors: &press_neighbors [ARD, ZDF, ORF, SRF, RTL, ntv, n-tv, NTV, Spiegel, SPIEGEL, FAZ, SZ, Süddeutsche,
      taz, TAZ, Welt, WELT, Zeit, ZEIT, Bild, BILD, Stern, STERN, Focus, FOCUS, NIUS, Nius, Tagesspiegel,
      Handelsblatt, FR, NZZ, Tichy, Cicero, Compact, Emma, EMMA, t-online, T-Online, Springer, Tagesschau,
      tagesschau, ÖRR, BBC, CNN, Reuters, dpa, Correctiv, Apollo, Overton, Krone, Kurier, Blick]
  press_m:   # masculine titles: "der Spiegel" is also the mirror ("im Spiegel betrachten"), so no article
    before: &press_m_before [laut, lt., Quelle, Quellen, schreibt, schrieb, berichtet, berichtete, meldet, titelt,
      zitiert, beim, vom]
    after: *press_after
    colon: true
    quoted: true
    compound: *press_compound
    neighbors: *press_neighbors
  feminine_org:  # "die BVG" (the transit company) vs. "das BVG" (the court)
    before: [die, der, Liebe]
  press_mag:  # magazines whose name is a word but rarely follows "im" otherwise: "im Stern", "im Cicero"
    before: [laut, lt., Quelle, Quellen, schreibt, schrieb, berichtet, berichtete, meldet, titelt, zitiert, beim, vom,
      im, ins]
    after: *press_after
    colon: true
    quoted: true
    compound: *press_compound
    neighbors: *press_neighbors

