# Curated seed list of PUBLIC persons and organisations, plus apps & digital services.
#
# Only entities in this file (or Wikidata items passing the strict public-figure
# filter in analysis/wikidata.py) are ever allowlisted and aggregated.
#
# Alias syntax:
#   "Merz"        plain alias, matched case-insensitively at word boundaries
#   "=SAP"        case-sensitive
#   "~Reiche"     weak/ambiguous: case-sensitive AND only accepted if the NER model
#                 tags an overlapping PER (persons) / ORG (organisations) span, or a
#                 keyword of the entity's `context` occurs in the comment / article title
#   "@Leverkusen" contextual: case-sensitive AND only accepted if a keyword of the
#                 entity's `context` occurs in the comment or the article title
#   "^Linke"      local: case-sensitive AND only on sources of the entity's own country
#                 (generic words that mean a specific party only in one country); "^~BR" / "^@X"
#                 combine local with weak / contextual ("BR" on blick.ch is the Swiss Bundesrat)
#   "%Bild"       cue-only: case-sensitive AND only accepted with a cue of the entity's `cue` set
#                 (see `cues:` below: "laut Bild", "der Bild", "„Bild“", "Bild berichtet",
#                 "Bild-Chef", "Spiegel, FAZ und Bild"); context keywords are not enough
#                 ("ein Bild machen" in a comment about an "Artikel")
# Contextual aliases of an entity with a `cue` set are also accepted with a cue alone. Contextual
# names that start with an article ("Die Welt", "Die Zeit") need a cue at the start of a sentence
# ("Die Welt steuert auf 2,8 Grad zu" is the world). All-caps contextual, weak and cue aliases
# (and case-sensitive ones of entities with a cue set) are not linked in all-caps text ("IN DIESER
# IRREN ZEIT"). An NER lookup of a case-sensitive alias needs the exact spelling ("Zeit" is not "ZEIT").
# The display name is always an alias as well. `country` breaks ties between
# entities sharing an alias (e.g. "Grüne" on an Austrian vs. a German site).
# `wikidata` was resolved with scripts/resolve_wikidata.py and checked by hand.
#
# Types: PER (persons), PARTY, ORG (organisations, companies, media, clubs) and PRODUCT
# ("Apps & Dienste": apps, platforms, digital services, operating systems, games). A brand that
# is mainly discussed as a service is a PRODUCT (Netflix, PayPal, Temu); the company behind a
# platform stays an ORG (Meta Platforms vs. Facebook, Google vs. Google Suche). Product names that
# are words or first names ("Signal", "Threads", "Claude", "Bolt") are contextual and are
# rejected when the NER model tags the span as a person.

