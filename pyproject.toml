[project]
name = "meinungspuls-analysis"
version = "1.0.0"
description = "Entity recognition, linking and target sentiment for German news comments (Meinungspuls)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", ".cache"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
